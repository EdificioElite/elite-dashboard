name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and start E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/health > /dev/null && \
               curl -sf http://localhost:5173/ > /dev/null; then
              echo "Services ready"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 5
          done
          echo "Services did not become healthy"
          docker compose -f docker-compose.e2e.yml logs
          exit 1

      - name: Run Playwright tests
        run: docker compose -f docker-compose.e2e.yml run --rm playwright

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  vercel-alias:
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alias preview to dev.edificioelite.com
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g vercel

          echo "Waiting for Vercel preview deployment..."
          for i in $(seq 1 12); do
            PREVIEW_URL=$(gh pr view ${{ github.event.pull_request.number }} \
              --json comments --jq '.comments[] | select(.author.login=="vercel") | .body' | \
              grep -oP 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -1)
            if [ -n "$PREVIEW_URL" ]; then
              echo "Found: $PREVIEW_URL"
              break
            fi
            echo "  attempt $i/12..."
            sleep 10
          done

          if [ -z "$PREVIEW_URL" ]; then
            echo "No Vercel preview URL found in PR comments"
            exit 1
          fi
          echo "Aliasing $PREVIEW_URL -> dev.edificioelite.com"
          vercel alias set "$PREVIEW_URL" dev.edificioelite.com \
            --token "$VERCEL_TOKEN" \
            --scope cp-edificio-elite-s-projects
