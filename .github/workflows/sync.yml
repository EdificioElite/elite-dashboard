name: Sync main to dev

on:
  push:
    branches: [main]

jobs:
  back-merge:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if main is ahead of dev
        id: check
        run: |
          git fetch origin dev main
          DIFF=$(git rev-list origin/dev..origin/main --count)
          echo "commits_ahead=${DIFF}" >> $GITHUB_OUTPUT
          echo "main esta ${DIFF} commits por delante de dev"

      - name: Close existing sync PRs
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          gh pr list --head main --base dev --state open --json number --jq '.[].number' | while read num; do
            echo "Cerrando PR de sync existente #${num}"
            gh pr close "${num}" --comment "Reemplazado por un nuevo PR de sincronizacion."
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR main → dev
        if: steps.check.outputs.commits_ahead != '0'
        id: create
        run: |
          URL=$(gh pr create \
            --title "Sincronizar main → dev" \
            --body "PR automatica para sincronizar cambios de main (release, hotfix, version bump) de vuelta a dev." \
            --head main \
            --base dev)
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "PR creada: ${URL}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.check.outputs.commits_ahead != '0' && steps.create.outputs.url != ''
        run: |
          gh pr merge "${{ steps.create.outputs.url }}" --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nothing to sync
        if: steps.check.outputs.commits_ahead == '0'
        run: echo "main no tiene commits nuevos respecto a dev, nada que sincronizar."
