name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tipo de version'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "${LAST_TAG}" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "Last tag: ${LAST_TAG}"

          MAJOR=$(echo "${LAST_TAG}" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "${LAST_TAG}" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "${LAST_TAG}" | sed 's/v//' | cut -d. -f3)

          case "${{ inputs.version }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Create tag and GitHub release
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} ya existe, abortando"
            exit 1
          fi

          git fetch origin dev
          DEV_SHA=$(git rev-parse origin/dev)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${TAG}" "${DEV_SHA}"
          git push origin "${TAG}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --target "${DEV_SHA}" \
            --generate-notes
