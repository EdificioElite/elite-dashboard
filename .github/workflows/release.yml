name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tipo de version'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Check if dev is ahead of main
        id: check
        run: |
          git fetch origin dev main
          DIFF=$(git rev-list origin/main..origin/dev --count)
          echo "commits_ahead=${DIFF}" >> $GITHUB_OUTPUT
          echo "dev esta ${DIFF} commits por delante de main"

      - name: Close existing release PRs
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          gh pr list --head dev --base main --state open --json number --jq '.[].number' | while read num; do
            echo "Cerrando PR de release existente #${num}"
            gh pr close "${num}" --comment "Reemplazado por un nuevo PR de release."
          done

      - name: Compute next version
        if: steps.check.outputs.commits_ahead != '0'
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "${LAST_TAG}" ]; then
            LAST_TAG="v0.0.0"
          fi
          echo "Last tag: ${LAST_TAG}"

          MAJOR=$(echo "${LAST_TAG}" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "${LAST_TAG}" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "${LAST_TAG}" | sed 's/v//' | cut -d. -f3)

          case "${{ inputs.version }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: ${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Bump version in package.json files
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' api/package.json > tmp.json && mv tmp.json api/package.json

      - name: Create release branch and push
        if: steps.check.outputs.commits_ahead != '0'
        id: branch
        run: |
          BRANCH="release/v${{ steps.version.outputs.version }}"
          git checkout -b "${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json api/package.json
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
          git push origin "${BRANCH}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Create PR release branch → dev and auto-merge
        if: steps.check.outputs.commits_ahead != '0'
        id: dev_pr
        run: |
          PR_URL=$(gh pr create \
            --title "chore: bump version to v${{ steps.version.outputs.version }}" \
            --body "Actualiza version en package.json a v${{ steps.version.outputs.version }} antes del release." \
            --head "${{ steps.branch.outputs.branch }}" \
            --base dev)

          PR_NUMBER=$(echo "${PR_URL}" | grep -oP '\d+$')
          echo "PR a dev creada: ${PR_URL}"
          echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT

          gh pr merge "${PR_NUMBER}" --auto --merge

      - name: Wait for CI on release branch
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          echo "Esperando CI trigger por push a ${BRANCH}..."
          for i in $(seq 1 60); do
            sleep 10
            CONCLUSION=$(gh run list --branch "${BRANCH}" --workflow CI --limit 1 --json conclusion,status --jq '.[0].conclusion // "waiting"')
            echo "  Intento $i/60: CI estado = ${CONCLUSION}"
            case "${CONCLUSION}" in
              success)
                echo "CI paso en ${BRANCH}"
                exit 0
                ;;
              failure|cancelled|skipped)
                echo "CI fallo en ${BRANCH}: ${CONCLUSION}. Cerrando PR #${{ steps.dev_pr.outputs.number }}"
                gh pr close "${{ steps.dev_pr.outputs.number }}" --comment "CI fallo en ${BRANCH}. Release cancelado."
                exit 1
                ;;
            esac
          done
          echo "Timeout esperando CI en ${BRANCH}"
          exit 1

      - name: Wait for dev PR to merge
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          for i in $(seq 1 30); do
            STATE=$(gh pr view "${{ steps.dev_pr.outputs.number }}" --json state --jq '.state' 2>/dev/null || echo "OPEN")
            echo "  Intento $i/30: estado PR dev = ${STATE}"
            if [ "${STATE}" = "MERGED" ]; then
              echo "PR a dev mergeada"
              exit 0
            fi
            sleep 10
          done
          echo "Timeout esperando merge de PR a dev"
          exit 1

      - name: Wait for dev push CI to complete
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          git fetch origin dev
          DEV_SHA=$(git rev-parse origin/dev)
          echo "Esperando CI en dev (${DEV_SHA})..."
          for i in $(seq 1 60); do
            sleep 10
            RUN=$(gh run list --branch dev --workflow CI --limit 1 --json conclusion,headSha --jq '.[0]')
            CONCLUSION=$(echo "${RUN}" | jq -r '.conclusion // "waiting"')
            RUN_SHA=$(echo "${RUN}" | jq -r '.headSha // ""')
            echo "  Intento $i/60: CI en dev = ${CONCLUSION} (SHA: ${RUN_SHA:0:7})"
            if [ "${RUN_SHA}" = "${DEV_SHA}" ] && [ "${CONCLUSION}" = "success" ]; then
              echo "CI en dev paso"
              exit 0
            elif [ "${CONCLUSION}" = "failure" ] || [ "${CONCLUSION}" = "cancelled" ]; then
              echo "CI en dev fallo: ${CONCLUSION}"
              exit 1
            fi
          done
          echo "Timeout esperando CI en dev"
          exit 1

      - name: Create release PR dev → main and auto-merge
        if: steps.check.outputs.commits_ahead != '0'
        run: |
          git fetch origin dev
          PR_URL=$(gh pr create \
            --title "Release v${{ steps.version.outputs.version }}" \
            --body $'PR automatizada de release v${{ steps.version.outputs.version }}.\n\nTipo: `${{ inputs.version }}`.' \
            --head dev \
            --base main)

          PR_NUMBER=$(echo "${PR_URL}" | grep -oP '\d+$')
          echo "PR a main creada: ${PR_URL}"

          gh pr merge "${PR_NUMBER}" --auto --merge

      - name: Nothing to promote
        if: steps.check.outputs.commits_ahead == '0'
        run: echo "dev no tiene commits nuevos respecto a main, nada que publicar."
